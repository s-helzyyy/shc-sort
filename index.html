<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14131c"><meta name="description" content="二人から好きな顔を選んで、あなたのスハクル好きな顔9選を作ろう。">
<title>スハクル好きな顔9選メーカー</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffffff'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#f7f4fb;background:#14131c;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.wrap{width:min(100% - 32px,720px);margin:auto;padding:36px 0 84px}header{text-align:center;margin-bottom:28px}h1{font-size:clamp(1.75rem,6vw,3.3rem);line-height:1.35;letter-spacing:.045em;color:#ff87c5;margin:0 0 12px}.heart{font-size:1.7rem}.chip{display:inline-block;color:#d4a3ff;border:1px solid #b47ae3;border-radius:100px;padding:6px 16px;font-size:.9rem}h2{font-size:1.35rem;margin:0 0 12px}.sub{color:#b9b5c2;line-height:1.7;margin:0 0 24px}.panel{background:#20202e;border:1px solid #413b53;border-radius:26px;padding:24px;margin:18px 0}.intro{border-color:#a36bd2}.intro p{margin:.4rem 0;line-height:1.7}.intro strong{color:#e0a5ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode,.action,.small{border:1px solid #5a506c;border-radius:19px;background:#242433;color:#fff;padding:18px;text-align:left}.mode:hover,.mode:focus-visible,.choice:hover,.choice:focus-visible{border-color:#e7a5ff;outline:2px solid #a679d4;outline-offset:2px}.mode strong{display:block;color:#d4a0fa;font-size:1.2rem}.mode span{display:block;color:#bdb9c8;font-size:.9rem;margin-top:8px}.action{background:linear-gradient(110deg,#a55acb,#e366aa);border:0;text-align:center;font-weight:700;width:100%;margin-top:18px}.small{padding:10px 16px;text-align:center;font-size:.9rem}.secondary{background:transparent;color:#d9bedf;border:1px solid #6e5b79}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .small{flex:1}.entry{display:flex;align-items:center;gap:12px;border:1px solid #494455;border-radius:17px;padding:9px;margin:10px 0;min-height:72px}.avatar{width:54px;height:54px;flex:none;object-fit:cover;border-radius:12px;background:#343045;display:grid;place-items:center;color:#aaa}.entry input[type=text]{min-width:0;width:100%;padding:11px;border-radius:10px;border:1px solid #5b536c;background:#171720;color:white}.entry input[type=file]{display:none}.upload{flex:none;border:1px solid #7a648c;border-radius:10px;padding:9px 11px;color:#e9c7ff;cursor:pointer;font-size:.85rem}.remove{border:0;background:none;color:#d9bbd3;font-size:1.3rem;padding:8px}.error{color:#ffabc4;min-height:1.5em}.hidden{display:none!important}.progress{height:9px;background:#3c3648;border-radius:10px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:linear-gradient(90deg,#bc7be9,#ff7fb8);width:0}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.choice{border:2px solid #5c4c70;background:#262434;border-radius:22px;color:#fff;padding:10px;min-width:0;overflow:hidden}.choice img,.placeholder{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:15px;background:#393347}.placeholder{display:grid;place-items:center;font-size:3rem;color:#ad92ba}.choice strong{display:block;padding:12px 2px 4px;overflow-wrap:anywhere;font-size:1.1rem}.vs{font-size:1.3rem;color:#ec8cce;font-weight:900}.game-actions{display:flex;gap:10px;margin-top:16px}.game-actions button{flex:1}.result-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.result-card{background:#292636;border:1px solid #594c69;border-radius:16px;padding:9px;text-align:center;min-width:0}.result-card img,.result-card .placeholder{aspect-ratio:1;object-fit:cover;width:100%;border-radius:10px}.rank{color:#fba6d8;font-weight:800;margin:8px 0 3px}.result-card strong{display:block;overflow-wrap:anywhere}footer{text-align:center;color:#827e91;margin-top:42px;font-size:.8rem}@media(max-width:540px){.wrap{padding-top:28px}.panel{padding:18px}.grid{grid-template-columns:1fr}.versus{gap:6px}.choice{padding:5px;border-radius:15px}.choice img,.choice .placeholder{border-radius:10px}.vs{font-size:.9rem}.entry{gap:7px}.upload{padding:9px 6px}.result-list{gap:7px}.result-card{padding:6px;font-size:.83rem}}@media(max-width:370px){.entry{flex-wrap:wrap}.entry input[type=text]{flex:1}}

:root{color:#25202c;background:#fff}body{background:#fff}.panel{background:#fff;border-color:#ded5e6}.intro{background:#fdf8ff;border-color:#d8b1e7}h1{color:#b83f8d}.chip{color:#8240a0;border-color:#a967c8;background:#fbf4ff}.sub{color:#625a69}.mode,.small{background:#fff;color:#282030;border-color:#cec2d6}.mode strong{color:#8d3da8}.mode span{color:#625a69}.mode:hover,.mode:focus-visible,.choice:hover,.choice:focus-visible{border-color:#ae62c7;outline-color:#ae62c7}.secondary{background:#fff;color:#65347b;border-color:#aa8ab8}.entry{border-color:#e5dce9}.avatar,.placeholder{background:#f4eaf6;color:#986da8}.entry input[type=text]{background:#fff;color:#282030;border-color:#cfc4d4}.upload{color:#6f3b88;border-color:#b496c0}.remove{color:#6f3b88}.progress{background:#f0e7f3}.choice{background:#fff;color:#282030;border-color:#d8c5e0}.result-card{background:#fff;border-color:#ded2e4}.result-card .placeholder{background:#f4eaf6}.vs{color:#a54793}footer{color:#6d6571}
.mode{min-height:128px}.intro{margin-top:8px}
</style>
</head>
<body><main class="wrap">
<header><h1><span class="heart">🎸</span> スハクル<br>好きな顔9選メーカー</h1><span class="chip">✦ Eloレーティング方式</span></header>
<section id="setup">
<div class="panel intro"><h2>好きな顔を選んで、9選を作ろう</h2><p>2人を見比べて、好きな方をタップしてね。</p></div>
<div class="panel"><h2>比較する回数を選ぶ</h2><div class="grid"><button class="mode" type="button" data-rounds="100"><strong>🎯 スタンダード（100回）</strong><span>じっくり比べて選ぶ</span></button><button class="mode" type="button" data-rounds="150"><strong>👑 ガチ（150回）</strong><span>もっと比べて選ぶ</span></button></div></div>
</section>
<section id="game" class="hidden" aria-live="polite"><div class="panel"><div class="row"><h2 style="margin:0;flex:1">どっちの顔が好き？</h2><strong id="counter"></strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="versus"><button class="choice" id="left" type="button"></button><span class="vs">VS</span><button class="choice" id="right" type="button"></button></div><div class="game-actions"><button class="small secondary" id="undo" type="button">↶ ひとつ戻す</button></div></div><button class="small secondary" id="stop" type="button">最初からやり直す</button></section>
<section id="results" class="hidden"><div class="panel"><h2>👑 あなたの好きな顔9選</h2><p class="sub">選んだ結果から上位9人を並べました。</p><div class="result-list" id="resultList"></div><div class="row"><button class="small secondary" id="retry" type="button">同じ候補でもう一度</button><button class="small secondary" id="reset" type="button">回数を選び直す</button></div></div></section>
<footer>スハクル好きな顔9選メーカー</footer></main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const names='キフン|キム・ゴヌ|ブロディ|ヤン・ヒョク|イ・ユンソ|イ・ジュノ|ジャオ・ジアイン|チェ・ジンゴン|ケイテン|ハンビン・キム|キム・ウンソン|キム・ジホ|ナ・ユハ|リアン|サギソモル|イ・ウヨン|イ・ユンチャン|チョン・ウソク|チョ・ジュヨン|チェ・ピルギュ|クォン・ヨンビン|キム・ゴンデ|キム・ウンチャンA|キム・ウンチャンB|ナム・スンヒョン|パク・チョルギ|シン・ジェミン|カズキ|テサホ|ハギワ|キム・ジュニョン|デイン|マシャ|パク・ヒョンビン|サニ|ユ・ホジン|チョン・ヨプ|チョン・ウンチャン|チュ・ジファン|キム・ギョンウク|キム・シフ|キム・ウィジン|ソ・ウスン|オ・ダジュン|ユン・ヨンジュン|チャン・ジェヒョン|チェ・ヒョンジュン|ケビン・パク|チェ・チヨン|ハン・ジュンヒ'.split('|');
const photos={'キフン':'photos/kihun.webp','キム・ゴヌ':'photos/kim-gonwoo.webp','ブロディ':'photos/brody.webp','ヤン・ヒョク':'photos/yang-hyuk.webp','イ・ユンソ':'photos/lee-yoonseo.webp','イ・ジュノ':'photos/lee-junho.webp','ジャオ・ジアイン':'photos/zhao-jiayin.webp','チェ・ジンゴン':'photos/choi-jingeon.webp','ケイテン':'photos/keiten.webp','ハンビン・キム':'photos/hanbin-kim.webp','キム・ウンソン':'photos/kim-eunseong.jpg','キム・ジホ':'photos/kim-jiho.webp','ナ・ユハ':'photos/na-yuha.webp','リアン':'photos/lian.webp','イ・ウヨン':'photos/lee-wooyoung.webp','イ・ユンチャン':'photos/lee-yoonchan.webp','キム・ウィジン':'photos/kim-uijin.webp','サギソモル':'photos/sagi-somoru.webp','キム・シフ':'photos/kim-sihu.webp','チェ・ピルギュ':'photos/choi-pilgyu.webp','チョ・ジュヨン':'photos/cho-jooyoung.webp','チョン・ウソク':'photos/jeong-wooseok.webp','チェ・ヒョンジュン':'photos/choi-hyunjun.webp','キム・ギョンウク':'photos/kim-gyeonguk.webp','チャン・ジェヒョン':'photos/jang-jaehyun.webp','ソ・ウスン':'photos/seo-wooseung.webp','オ・ダジュン':'photos/oh-dajun.webp','ケビン・パク':'photos/kevin-park.webp','ハン・ジュンヒ':'photos/han-junhee.webp','ユン・ヨンジュン':'photos/yoon-yongjun.webp','キム・ウンチャンA':'photos/kim-eunchan-a.webp','キム・ウンチャンB':'photos/kim-eunchan-b.webp','キム・ゴンデ':'photos/kim-gonde.webp','クォン・ヨンビン':'photos/kwon-youngbin.webp','キム・ジュニョン':'photos/kim-junyoung.webp','シン・ジェミン':'photos/shin-jaemin.webp','ナム・スンヒョン':'photos/nam-seunghyun.webp','テサホ':'photos/tesaho.webp','パク・チョルギ':'photos/park-cheolgi.webp','カズキ':'photos/kazuki.webp','サニ':'photos/sani.webp','マシャ':'photos/masha.webp','ハギワ':'photos/hagiwa.webp','ユ・ホジン':'photos/yoo-hojin.webp','チュ・ジファン':'photos/chu-jihwan.webp','チェ・チヨン':'photos/choi-chiyoung.webp','デイン':'photos/dain.webp','チョン・ヨプ':'photos/jeong-yeop.webp','チョン・ウンチャン':'photos/jeong-eunchan.webp','パク・ヒョンビン':'photos/park-hyungbin.webp'};
const people=names.map(name=>({name,photo:photos[name]||''}));
let ratings=[],history=[],pair=[],rounds=100,turn=0,counts=[];
function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function art(p){return p.photo?`<img src="${p.photo}" alt="">`:'<div class="placeholder" aria-hidden="true">🎸</div>'}
function show(id){for(const s of ['setup','game','results'])$('#'+s).classList.toggle('hidden',s!==id);window.scrollTo(0,0)}
function pick(){let best=null,score=-Infinity;for(let a=0;a<people.length;a++)for(let b=a+1;b<people.length;b++){const imbalance=-(counts[a]+counts[b])*2,closeness=-Math.abs(ratings[a]-ratings[b])/25,random=Math.random()*12,s=imbalance+closeness+random;if(s>score){score=s;best=[a,b]}}return Math.random()<.5?best:best.reverse()}
function draw(keepPair=false){if(turn>=rounds){finish();return}if(!keepPair)pair=pick();$('#counter').textContent=`${turn+1} / ${rounds}`;$('#bar').style.width=`${turn/rounds*100}%`;for(const [side,i] of [['left',pair[0]],['right',pair[1]]])$('#'+side).innerHTML=art(people[i])+`<strong>${escape(people[i].name)}</strong>`;$('#undo').disabled=!history.length}
function start(n){rounds=n;ratings=people.map(()=>1500);counts=people.map(()=>0);history=[];turn=0;show('game');draw()}
document.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>start(Number(b.dataset.rounds)));
function vote(choice){const [a,b]=pair;history.push({ratings:[...ratings],counts:[...counts],pair:[...pair]});const expected=1/(1+10**((ratings[b]-ratings[a])/400)),s=choice===a?1:0;ratings[a]+=32*(s-expected);ratings[b]+=32*((1-s)-(1-expected));counts[a]++;counts[b]++;turn++;draw()}
$('#left').onclick=()=>vote(pair[0]);$('#right').onclick=()=>vote(pair[1]);
$('#undo').onclick=()=>{const last=history.pop();if(!last)return;ratings=last.ratings;counts=last.counts;turn--;pair=last.pair;draw(true)};
function finish(){const order=people.map((p,i)=>({p,i})).sort((a,b)=>ratings[b.i]-ratings[a.i]);$('#resultList').innerHTML=order.slice(0,9).map(({p},i)=>`<div class="result-card">${art(p)}<div class="rank">${i+1}位</div><strong>${escape(p.name)}</strong></div>`).join('');show('results')}
$('#retry').onclick=()=>start(rounds);$('#reset').onclick=()=>show('setup');
$('#stop').onclick=()=>{if(confirm('今回の比較をやめて、最初からやり直しますか？'))show('setup')};
})();
</script></body></html>
